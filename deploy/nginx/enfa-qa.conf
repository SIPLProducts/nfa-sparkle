# eNFA QA server - nginx vhosts
# Install to /etc/nginx/sites-available/enfa-qa.conf and symlink into sites-enabled.
#
#   8081 -> eNFA app          (Node on 127.0.0.1:3000)
#   8001 -> Supabase API/Kong (docker on 127.0.0.1:54321)
#   8082 -> Supabase Studio   (docker on 127.0.0.1:54323)
#   3004 -> SAP middleware    (Node on 127.0.0.1:3005)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------- eNFA app --
server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    access_log /var/log/nginx/enfa-app.access.log;
    error_log  /var/log/nginx/enfa-app.error.log;

    # base64 attachment uploads
    client_max_body_size 25m;
    client_body_timeout  180s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host:$server_port;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # SAP attachment calls can take ~95s; keep well above that
        proxy_connect_timeout 30s;
        proxy_send_timeout   180s;
        proxy_read_timeout   180s;

        proxy_buffering off;
    }
}

# ------------------------------------------------------- Supabase API/Kong --
server {
    listen 8001;
    listen [::]:8001;
    server_name _;

    access_log /var/log/nginx/supabase-api.access.log;
    error_log  /var/log/nginx/supabase-api.error.log;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:54321;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;   # realtime websockets
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering off;
    }
}

# --------------------------------------------------------- Supabase Studio --
server {
    listen 8082;
    listen [::]:8082;
    server_name _;

    access_log /var/log/nginx/supabase-studio.access.log;
    error_log  /var/log/nginx/supabase-studio.error.log;

    # Studio is an admin surface - restrict it to your office / VPN range.
    # Replace the sample range, then reload nginx.
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 192.168.0.0/16;
    deny  all;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:54323;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}

# ---------------------------------------------------------- SAP middleware --
server {
    listen 3004;
    listen [::]:3004;
    server_name _;

    access_log /var/log/nginx/enfa-middleware.access.log;
    error_log  /var/log/nginx/enfa-middleware.error.log;

    client_max_body_size 25m;
    client_body_timeout  200s;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SAP attachment fetches for large records run ~95-170s
        proxy_connect_timeout 30s;
        proxy_send_timeout   200s;
        proxy_read_timeout   200s;

        proxy_buffering off;
    }
}
