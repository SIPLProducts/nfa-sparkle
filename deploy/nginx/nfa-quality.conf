# eNFA - QUALITY server nginx configuration
#
# Install:
#   sudo cp deploy/nginx/nfa-quality.conf /etc/nginx/sites-available/nfa-quality.conf
#   sudo ln -sf /etc/nginx/sites-available/nfa-quality.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Public port map
#   8081 -> eNFA app          (Node   127.0.0.1:3000)
#   8001 -> Supabase API/Kong (docker 127.0.0.1:54321)
#   8082 -> Supabase Studio   (docker 127.0.0.1:54323)
#   3004 -> SAP middleware    (Node   127.0.0.1:3005)
#
# Note: nginx requires one server block per listen port, so the four public
# services below each have their own server block, but everything lives in this
# single file and shares the upstream definitions above it.

# Upstreams: all backend services defined in one place
upstream enfa_app {
    server 127.0.0.1:3000;
}

upstream supabase_kong {
    server 127.0.0.1:54321;
}

upstream supabase_studio {
    server 127.0.0.1:54323;
}

upstream sap_middleware {
    server 127.0.0.1:3005;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------- eNFA app --
server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    access_log /var/log/nginx/nfa-quality-app.access.log;
    error_log  /var/log/nginx/nfa-quality-app.error.log;

    # base64 attachment uploads
    client_max_body_size 25m;
    client_body_timeout  200s;

    # Static frontend: copy the built `dist/` folder here (npm run build)
    root /opt/enfa/frontend;
    index index.html;

    # hashed build assets - safe to cache forever
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # server functions + API routes -> Node service (.output/server/index.mjs)
    location ~ ^/(_serverFn|api)/ {
        proxy_pass http://enfa_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host:$server_port;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # SAP attachment calls can run ~95-170s
        proxy_connect_timeout  30s;
        proxy_send_timeout    200s;
        proxy_read_timeout    200s;

        proxy_buffering off;
    }

    # Browser-facing backend APIs share the app origin. Match the /v1/ paths
    # specifically so the application's /auth login page remains an SPA route.
    location ~ ^/(auth|rest|realtime|storage)/v1/ {
        proxy_pass http://supabase_kong;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering off;
    }

    # everything else is the SPA: serve the file if it exists, else index.html
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}


# ------------------------------------------------------- Supabase API/Kong --
server {
    listen 8001;
    listen [::]:8001;
    server_name _;

    access_log /var/log/nginx/nfa-quality-supabase-api.access.log;
    error_log  /var/log/nginx/nfa-quality-supabase-api.error.log;

    client_max_body_size 50m;

    location / {
        proxy_pass http://supabase_kong;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;    # realtime websockets
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout  30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering off;
    }
}

# --------------------------------------------------------- Supabase Studio --
server {
    listen 8082;
    listen [::]:8082;
    server_name _;

    access_log /var/log/nginx/nfa-quality-studio.access.log;
    error_log  /var/log/nginx/nfa-quality-studio.error.log;

    # Studio is an admin surface. Replace with your office / VPN ranges.
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny  all;

    client_max_body_size 50m;

    location / {
        proxy_pass http://supabase_studio;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}

# ---------------------------------------------------------- SAP middleware --
server {
    listen 3004;
    listen [::]:3004;
    server_name _;

    access_log /var/log/nginx/nfa-quality-middleware.access.log;
    error_log  /var/log/nginx/nfa-quality-middleware.error.log;

    client_max_body_size 25m;
    client_body_timeout  200s;

    location / {
        proxy_pass http://sap_middleware;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SAP attachment fetches for large records run ~95-170s
        proxy_connect_timeout  30s;
        proxy_send_timeout    200s;
        proxy_read_timeout    200s;

        proxy_buffering off;
    }
}
