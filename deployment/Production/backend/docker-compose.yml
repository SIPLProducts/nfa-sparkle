############################################################
# eNFA PRODUCTION - standalone Supabase self-hosted stack
#
# This is a COMPLETE docker-compose file. It does NOT require cloning the
# official supabase/docker repo. It is isolated from the existing VMS DEV/PROD
# stacks by name, network, ports and volumes.
#
# Copy this file to your production backend folder, e.g.:
#   /opt/Ramky_Applications/NFA-Approval/Production/backend/docker-compose-production.yml
#
# Start:
#   docker compose -p nfa-production -f docker-compose-production.yml up -d
#
# Stop:
#   docker compose -p nfa-production -f docker-compose-production.yml down
#
# View logs:
#   docker compose -p nfa-production -f docker-compose-production.yml logs -f
############################################################

name: nfa-production

x-common-env: &common-env
  # Database
  POSTGRES_HOST: ${POSTGRES_HOST:-db}
  POSTGRES_DB: ${POSTGRES_DB:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  # JWT
  JWT_SECRET: ${JWT_SECRET}
  JWT_EXPIRY: ${JWT_EXPIRY:-3600}
  # API keys
  ANON_KEY: ${ANON_KEY}
  SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
  # URLs seen by browsers / other containers
  SITE_URL: ${SITE_URL:-http://localhost:8091}
  API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:8011}
  SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8011}
  # Dashboard
  STUDIO_DEFAULT_ORGANIZATION: ${STUDIO_DEFAULT_ORGANIZATION:-Ramky}
  STUDIO_DEFAULT_PROJECT: ${STUDIO_DEFAULT_PROJECT:-eNFA Production}
  DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-enfa-admin}
  DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
  # Auth
  DISABLE_SIGNUP: ${DISABLE_SIGNUP:-true}
  ENABLE_EMAIL_SIGNUP: ${ENABLE_EMAIL_SIGNUP:-true}
  ENABLE_EMAIL_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-true}
  ENABLE_ANONYMOUS_USERS: ${ENABLE_ANONYMOUS_USERS:-false}
  ENABLE_PHONE_SIGNUP: ${ENABLE_PHONE_SIGNUP:-false}
  ENABLE_PHONE_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM:-false}
  MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION:-/auth/v1/verify}
  MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE:-/auth/v1/verify}
  MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY:-/auth/v1/verify}
  MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE:-/auth/v1/verify}
  SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-admin@example.com}
  SMTP_HOST: ${SMTP_HOST:-supabase-mail}
  SMTP_PORT: ${SMTP_PORT:-2500}
  SMTP_USER: ${SMTP_USER:-fake_mail_user}
  SMTP_PASS: ${SMTP_PASS:-fake_mail_password}
  SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-eNFA Production}
  # Storage / REST
  PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,storage,graphql_public}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-file}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-52428800}
  IMGPROXY_ENABLE_WEBP_DETECTION: ${IMGPROXY_ENABLE_WEBP_DETECTION:-true}
  # Analytics (only used when analytics profile is enabled)
  LOGFLARE_PUBLIC_ACCESS_TOKEN: ${LOGFLARE_PUBLIC_ACCESS_TOKEN}
  LOGFLARE_PRIVATE_ACCESS_TOKEN: ${LOGFLARE_PRIVATE_ACCESS_TOKEN}

services:
  db:
    container_name: nfa-production-db
    image: supabase/postgres:15.8.1.085
    restart: unless-stopped
    healthcheck:
      test: pg_isready -U postgres -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_PORT_HOST:-54422}:5432"
    volumes:
      - type: volume
        source: nfa-production-db-data
        target: /var/lib/postgresql/data
      # Bootstrap SQL - runs ONLY on a fresh (empty) data volume.
      - type: bind
        source: ./volumes/db/00-roles.sh
        target: /docker-entrypoint-initdb.d/00-roles.sh
        read_only: true
      - type: bind
        source: ./volumes/db/realtime.sql
        target: /docker-entrypoint-initdb.d/20-realtime.sql
        read_only: true
      - type: bind
        source: ./volumes/db/webhooks.sql
        target: /docker-entrypoint-initdb.d/30-webhooks.sql
        read_only: true
      - type: bind
        source: ./volumes/db/logs.sql
        target: /docker-entrypoint-initdb.d/40-logs.sql
        read_only: true
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: postgres
      POSTGRES_HOST: /var/run/postgresql
    shm_size: 1gb
    networks:
      - nfa-production-net

  kong:
    container_name: nfa-production-kong
    image: kong/kong:3.9.1
    restart: unless-stopped
    entrypoint: ["bash", "-c", "kong start"]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,rate-limiting,response-transformer,file-log
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
    ports:
      - "127.0.0.1:${KONG_HTTP_PORT:-54421}:8000/tcp"
      - "127.0.0.1:${KONG_HTTPS_PORT:-54424}:8443/tcp"
    volumes:
      - type: bind
        source: ./volumes/api/kong.yml
        target: /home/kong/kong.yml
        read_only: true
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_started
      realtime:
        condition: service_healthy
      storage:
        condition: service_started
      meta:
        condition: service_healthy
    networks:
      - nfa-production-net

  auth:
    container_name: nfa-production-auth
    image: supabase/gotrue:v2.186.0
    restart: unless-stopped
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:9999/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    environment:
      <<: *common-env
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      # Database connection - REQUIRED. Without these GoTrue cannot run its
      # migrations at startup and the container stays unhealthy, which then
      # blocks kong and studio. supabase_auth_admin is created with this
      # password by volumes/db/00-roles.sh (runs on a fresh data volume only).
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:8011}
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:8091}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-true}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-true}
      GOTRUE_MAILER_EXTERNAL_ENABLED: "false"
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION:-/auth/v1/verify}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE:-/auth/v1/verify}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY:-/auth/v1/verify}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE:-/auth/v1/verify}
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "Confirm your signup"
      GOTRUE_MAILER_SUBJECTS_INVITE: "You have been invited"
      GOTRUE_MAILER_SUBJECTS_RECOVERY: "Reset your password"
      GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE: "Confirm your email change"
      GOTRUE_MAILER_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-admin@example.com}
      GOTRUE_MAILER_SMTP_HOST: ${SMTP_HOST:-supabase-mail}
      GOTRUE_MAILER_SMTP_PORT: ${SMTP_PORT:-2500}
      GOTRUE_MAILER_SMTP_USER: ${SMTP_USER:-fake_mail_user}
      GOTRUE_MAILER_SMTP_PASS: ${SMTP_PASS:-fake_mail_password}
      GOTRUE_MAILER_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-eNFA Production}
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMS_AUTOCONFIRM: "false"
      GOTRUE_SMS_MAX_FREQUENCY: "5s"
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-admin@example.com}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-supabase-mail}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-2500}
      GOTRUE_SMTP_USER: ${SMTP_USER:-fake_mail_user}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-fake_mail_password}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-eNFA Production}
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nfa-production-net

  rest:
    container_name: nfa-production-rest
    image: postgrest/postgrest:v14.8
    restart: unless-stopped
    # NOTE: the postgrest image is minimal (no wget/curl), so it has no
    # healthcheck. Dependents use `service_started` instead.
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,storage,graphql_public}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-extensions}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_OPENAPI_SERVER_PROXY_URI: ${API_EXTERNAL_URL:-http://localhost:8011}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nfa-production-net

  realtime:
    container_name: nfa-production-realtime
    image: supabase/realtime:v2.76.5
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-sSfL",
          "--head",
          "-o",
          "/dev/null",
          "-H",
          "Authorization: Bearer ${ANON_KEY}",
          "http://localhost:4000/api/tenants/realtime-dev/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      PORT: 4000
      DB_HOST: ${POSTGRES_HOST:-db}
      DB_PORT: ${POSTGRES_PORT:-5432}
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-postgres}
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_SSL: "false"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      DB_ENC_KEY: ${VAULT_ENC_KEY}
      APP_NAME: realtime
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      SECURE_CHANNELS: "true"
      JWT_SECRET: ${JWT_SECRET}
      JWT_CLAIMS_VALIDATORS: "{\"iss\": \"supabase\", \"iat\": \"\"}"
      EXTERNAL_ID: realtime-dev
      API_JWT_SECRET: ${JWT_SECRET}
      FLY_REGION: local
      FLY_ALLOC_ID: realtime-dev
      ERL_AFLAGS: "-proto_dist inet_tcp"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nfa-production-net

  storage:
    container_name: nfa-production-storage
    image: supabase/storage-api:v1.48.26
    restart: unless-stopped
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5000/status || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://nfa-production-rest:3010
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-52428800}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-file}
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: ${POOLER_TENANT_ID:-enfa-production}
      REGION: local
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://nfa-production-imgproxy:8080
    volumes:
      - type: volume
        source: nfa-production-storage-data
        target: /var/lib/storage
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
      imgproxy:
        condition: service_healthy
    networks:
      - nfa-production-net

  imgproxy:
    container_name: nfa-production-imgproxy
    image: darthsim/imgproxy:v3.30.1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      IMGPROXY_BIND: :8080
      IMGPROXY_USE_WEBP: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: ${IMGPROXY_ENABLE_WEBP_DETECTION:-true}
    networks:
      - nfa-production-net

  meta:
    container_name: nfa-production-meta
    image: supabase/postgres-meta:v0.96.3
    restart: unless-stopped
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8080/ || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: ${POSTGRES_HOST:-db}
      PG_META_DB_PORT: ${POSTGRES_PORT:-5432}
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nfa-production-net

  studio:
    container_name: nfa-production-studio
    image: supabase/studio:2026.04.27-sha-5f60601
    restart: unless-stopped
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3010/api/profile || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      STUDIO_DEFAULT_ORGANIZATION: ${STUDIO_DEFAULT_ORGANIZATION:-Ramky}
      STUDIO_DEFAULT_PROJECT: ${STUDIO_DEFAULT_PROJECT:-eNFA Production}
      SUPABASE_URL: http://nfa-production-kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8011}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      STUDIO_PORT: 3010
      STUDIO_PG_META_URL: http://nfa-production-meta:8080
      STUDIO_LOGFLARE_PUBLIC_TOKEN: ${LOGFLARE_PUBLIC_ACCESS_TOKEN}
      STUDIO_LOGFLARE_URL: http://nfa-production-analytics:4000
      NEXT_PUBLIC_ENABLE_LOGS: "true"
      STUDIO_AUTH_JWT_SECRET: ${JWT_SECRET}
    ports:
      - "127.0.0.1:${STUDIO_PORT:-54423}:3010"
    depends_on:
      kong:
        condition: service_healthy
      meta:
        condition: service_healthy
    networks:
      - nfa-production-net

  vector:
    container_name: nfa-production-vector
    image: timberio/vector:0.53.0-alpine
    restart: unless-stopped
    healthcheck:
      test: vector validate /etc/vector/vector.yml || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - type: bind
        source: ./volumes/logs/vector.yml
        target: /etc/vector/vector.yml
        read_only: true
      - type: bind
        source: ${DOCKER_SOCKET_LOCATION:-/var/run/docker.sock}
        target: /var/run/docker.sock
        read_only: true
    depends_on:
      analytics:
        condition: service_healthy
    networks:
      - nfa-production-net
    profiles:
      - analytics

  analytics:
    container_name: nfa-production-analytics
    image: supabase/logflare:1.36.1
    restart: unless-stopped
    healthcheck:
      test: curl -f http://localhost:4000/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      LOGFLARE_NODE_HOST: 127.0.0.1
      LOGFLARE_API_KEY: ${LOGFLARE_PRIVATE_ACCESS_TOKEN}
      LOGFLARE_MIN_CLUSTER_SIZE: 1
      LOGFLARE_SINGLE_TENANT: "true"
      LOGFLARE_SUPABASE_MODE: "true"
      LOGFLARE_SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      PHX_HTTP_PORT: 4000
      PHX_CHECK_ORIGIN: "false"
      DB_DATABASE: ${POSTGRES_DB:-postgres}
      DB_HOSTNAME: ${POSTGRES_HOST:-db}
      DB_PORT: ${POSTGRES_PORT:-5432}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_USERNAME: supabase_admin
      DB_SCHEMA: _analytics
      POSTGRES_BACKEND_URL: postgres://supabase_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}
      POSTGRES_BACKEND_SCHEMA: _analytics
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nfa-production-net
    profiles:
      - analytics

volumes:
  nfa-production-db-data:
  nfa-production-storage-data:

networks:
  nfa-production-net:
    name: nfa-production-net
    driver: bridge
